server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Redirects stay relative, so they keep https behind Fly's proxy.
  absolute_redirect off;

  # www.r3ydan.ee is an alias: send it to the main address.
  if ($host = "www.r3ydan.ee") {
    return 301 https://r3ydan.ee$request_uri;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location / {
    # /case-study and /portfolio work with or without the trailing slash, like on GitHub Pages.
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(mp4|jpe?g|png|webp|svg|ico|woff2?|pdf)$ {
    add_header Cache-Control "public, max-age=604800";
  }
}
