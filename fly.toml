# r3ydan.ee (landing page). Deploy: ~/.fly/bin/fly deploy --ha=false
app = "r3ydan-website"
primary_region = "arn"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always on, so the first visitor never waits for a machine to start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
